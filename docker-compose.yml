services:
  backend:
    image: python:3.12-slim
    working_dir: /app
    volumes: ["./backend:/app"]
    env_file: .env
    command: sh -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports: ["8010:8000"]
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes: ["./frontend:/app"]
    environment: ["NEXT_PUBLIC_API_URL=http://localhost:8010"]
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    ports: ["3000:3000"]
    depends_on: [backend]
